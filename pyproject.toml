[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "iac-plan-risk-reviewer"
version = "0.1.0"
description = "Local, evidence-linked review of four bounded Terraform AWS change risks"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic==2.14.1"]

[project.scripts]
iac-review = "iac_review.cli:main"

[dependency-groups]
dev = ["pytest==9.0.3", "ruff==0.17.2", "hatchling==1.27.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/iac_review"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = [".", "tests/eval"]

